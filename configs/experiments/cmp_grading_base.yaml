# Grading comparison, base model: one run gives both "single" (grading agent
# alone) and "vote" (3-agent majority) metrics on the same rows.
# Same setup as notebooks/multi_agent_vote/ with sampling, except for the
# grading prompt (prompts/grading/grading_v1.txt, see MULTI_AGENT_COMPARISON.md B3).
defaults:
  - configs/base.yaml

experiment_name: "cmp_grading_base"

models:
  grading: "configs/models/qwen3.5-9b.yaml"

stages:
  voting:
    enabled: true
  feedback:
    enabled: false        # grading only; feedback is compared in cmp_feedback_*

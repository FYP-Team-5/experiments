# configs/experiments/exp_local_test.yaml
defaults:
  - configs/base.yaml

experiment_name: "exp_local_test"

experiment:
  seeds: [42]
  batch_size: 2

models:
  grading: "configs/models/qwen_local.yaml"
  feedback: "configs/models/qwen_local.yaml"
  verification: "configs/models/qwen_local.yaml"

data:
  input_path: "data/processed/data_small.jsonl"    # Only 5 samples

stages:
  voting:
    enabled: true
  feedback:
    decoding:
      max_new_tokens: 128
  verification:
    enabled: true
    max_regenerations: 1
    decoding:
      max_new_tokens: 128

# configs/experiments/exp_local_test.yaml
defaults:
  - configs/base.yaml

experiment_name: "exp_local_test"

models:
  grading: "configs/models/qwen_local.yaml"
  feedback: "configs/models/qwen_local.yaml"
  verification: "configs/models/qwen_local.yaml"

prompt:
  grading_path: "prompts/grading/grading_v1.txt"
  feedback_path: "prompts/feedback/answer_rubric_v1.txt"
  verification_path: "prompts/verification/consistency_v1.txt"

data:

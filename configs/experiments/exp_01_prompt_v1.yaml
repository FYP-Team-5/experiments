defaults:
  - configs/base.yaml

experiment_name: "exp_01_answer_rubric"

models:
  grading: "configs/models/qwen3.5-9b-qlora.yaml"
  feedback: "configs/models/qwen3.5-9b.yaml"
  verification: "configs/models/qwen3.5-9b.yaml"

stages:
  feedback:
    # Feedback from the rubric alone; this prompt does not see the grade.
    system_prompt_path: "prompts/feedback/system_v1.txt"
    template_path: "prompts/feedback/answer_rubric_v1.txt"
    decoding:
      max_new_tokens: 512
  verification:
    enabled: true

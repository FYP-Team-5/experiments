experiment:
  # Question-level 80/10/10 splits, the same as the qlora notebooks. Every row
  # in any seed's test split is processed once; each seed is scored on its own.
  # Seed 42 only: both adapters (SmuFypTeam5/GradingQlora since 2026-11-05,
  # and SmuFypTeam5/feedback) were trained on the seed-42 split, so the test
  # rows of seeds 123 and 2026 include questions they were trained on.
  # scripts/compare.py scores the same seeds by default.
  seeds: [42]
  output_dir: "outputs"
  batch_size: 8                 # halved automatically after a CUDA out-of-memory error
  enable_thinking: false        # every Qwen3.5 run in the qlora repo is non-thinking

data:
  input_path: "data/processed/data.jsonl"

stages:
  grading:
    system_prompt_path: "prompts/grading/grading_v1.txt"   # the grading adapter's training prompt
    decoding:
      do_sample: false
      max_new_tokens: 128

  # Grade voting (notebooks/multi_agent_vote/): an evaluation agent re-grades,
  # a third grade breaks disagreements, and each criterion takes the majority.
  # The evaluator samples; with greedy decoding it would always agree with the grader.
  # models.voting defaults to models.grading.
  voting:
    enabled: false
    decoding:
      do_sample: true
      temperature: 0.7
      max_new_tokens: 128

  feedback:
    enabled: true
    # The feedback adapter's training prompt (feedback/qlora_feedback_qwen3.5-9B.ipynb).
    system_prompt_path: "prompts/feedback/key_points_system_v1.txt"
    template_path: "prompts/feedback/key_points_v1.txt"
    decoding:
      do_sample: false
      max_new_tokens: 320

  # Feedback verification: an LLM judge checks that score and feedback are
  # consistent. Rejected feedback is rewritten with the judge's notes, up to
  # max_regenerations times.
  # v1 problems: the verifier reasoned at length inside the "description"
  # strings and ran out of tokens before closing the JSON (about 25% of final
  # verdicts unreadable), and it saw only "Score: 1", so it rejected nearly all
  # feedback that named a missing point (1-3% pass on partial credit).
  # v2 asks for the JSON only, with short descriptions, and shows the score out
  # of the maximum, each criterion's mark and the reference answer.
  # 1024 tokens leaves room for several issues.
  verification:
    enabled: false
    template_path: "prompts/verification/consistency_v2.txt"
    max_regenerations: 0
    decoding:
      do_sample: false
      max_new_tokens: 1024
